services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pr-review-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: prreview
      POSTGRES_PASSWORD: prreview
      POSTGRES_DB: prreview
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prreview -d prreview"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
